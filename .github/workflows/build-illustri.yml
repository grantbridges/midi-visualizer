# .github/workflows/build-and-release.yml
#
# Manually-triggered workflow that builds the app for Windows, macOS (ARM),
# and macOS (Intel) using PyInstaller, then publishes a GitHub Release with
# all three build artifacts attached.

name: Build and Release Illustri MIDI Studio

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_label: windows
            artifact_name: illustri-windows.zip
          - os: macos-latest # Apple Silicon (ARM) runner
            platform_label: macos-arm64
            artifact_name: illustri-macos-arm64.zip
          - os: macos-13 # last Intel (x86_64) runner image
            platform_label: macos-x86_64
            artifact_name: illustri-macos-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ensure ffmpeg is executable (macOS)
        if: runner.os == 'macOS'
        run: chmod +x third-party/ffmpeg/darwin-*/ffmpeg

      - name: Build with PyInstaller
        run: pyinstaller illustri-app/Illustri.spec --clean --noconfirm

      - name: Package output (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact_name }}" .

      - name: Package output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: artifacts/**/*.zip
