# .github/workflows/build-and-release.yml
#
# Manually-triggered workflow that builds the app for Windows, macOS (ARM),
# and macOS (Intel) using PyInstaller, then publishes a GitHub Release with
# all three build artifacts attached.

name: Build and Release Illustri MIDI Studio

on:
  workflow_dispatch:
    inputs:
      major_version:
        required: true
        type: string
        default: "1"
      minor_version:
        required: true
        type: string
        default: "0"
      patch_version:
        required: true
        type: string
        default: "0-beta2"
      build_windows:
        description: "Build Windows installer"
        type: boolean
        default: true
      build_macos_arm:
        description: "Build macOS ARM (Apple Silicon) dmg"
        type: boolean
        default: true
      build_macos_intel:
        description: "Build macOS Intel dmg"
        type: boolean
        default: true

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-entries: ${{ steps.set-matrix.outputs.has-entries }}
      release_version: ${{ steps.set-version.outputs.release_version }}
      build_version: ${{ steps.set-version.outputs.build_version }}
    steps:
      # Based on checked build inputs, injects new matrix entries
      # for each OS build/release type
      - id: set-matrix
        run: |
          ENTRIES='[]'

          if [ "${{ inputs.build_windows }}" = "true" ]; then
            ENTRIES=$(echo "$ENTRIES" | jq -c '. += [{
              "os": "windows-latest",
              "platform_label": "windows",
              "artifact_name": "IllustriMIDIStudio-Setup.exe"
            }]')
          fi

          if [ "${{ inputs.build_macos_arm }}" = "true" ]; then
            ENTRIES=$(echo "$ENTRIES" | jq -c '. += [{
              "os": "macos-latest",
              "platform_label": "macos-arm64",
              "artifact_name": "illustri-macos-arm64.dmg"
            }]')
          fi

          if [ "${{ inputs.build_macos_intel }}" = "true" ]; then
            ENTRIES=$(echo "$ENTRIES" | jq -c '. += [{
              "os": "macos-15-intel",
              "platform_label": "macos-x86_64",
              "artifact_name": "illustri-macos-x86_64.dmg"
            }]')
          fi

          echo "matrix={\"include\":$ENTRIES}" >> "$GITHUB_OUTPUT"

          if [ "$ENTRIES" = "[]" ]; then
            echo "has-entries=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-entries=true" >> "$GITHUB_OUTPUT"
          fi

      # Computes two version strings:
      #  - release_version (major.minor.patch): used for the Release tag,
      #    Release name, and the Inno Setup installer's version metadata.
      #  - build_version (release_version + run number): used only for the
      #    VERSION baked into build_info.py, so each build is uniquely
      #    identifiable in-app without cluttering the public release tag.
      - id: set-version
        run: |
          RELEASE_VERSION="v${{ inputs.major_version }}.${{ inputs.minor_version }}.${{ inputs.patch_version }}"
          BUILD_VERSION="${RELEASE_VERSION}.${{ github.run_number }}"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has-entries == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ensure ffmpeg is executable (macOS)
        if: runner.os == 'macOS'
        run: chmod +x third-party/ffmpeg/darwin-*/ffmpeg

      - name: Set build info
        shell: python
        env:
          # Passed via env + os.environ rather than templated directly into
          # the script body
          BUILD_VERSION: ${{ needs.prepare-matrix.outputs.build_version }}
        run: |
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          version = os.environ["BUILD_VERSION"]
          now = datetime.now()
          build_date = f"{now.strftime('%b')} {now.day}, {now.year}"

          path = Path("build_info.py")
          text = path.read_text()

          text = re.sub(r'VERSION = ".*"', f'VERSION = "{version}"', text)
          text = re.sub(r'BUILD_DATE = .*', f'BUILD_DATE = "{build_date}"', text)

          path.write_text(text)
          print(f"Updated build_info.py -> VERSION={version}, BUILD_DATE={build_date}")

      - name: Build with PyInstaller
        run: pyinstaller illustri.spec --clean --noconfirm

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Package output (macOS - dmg)
        if: runner.os == 'macOS'
        run: |
          create-dmg \
            --volname "Illustri MIDI Studio" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Illustri MIDI Studio.app" 175 190 \
            --hide-extension "Illustri MIDI Studio.app" \
            --app-drop-link 425 190 \
            "${{ matrix.artifact_name }}" \
            "dist/Illustri MIDI Studio.app"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-matrix.outputs.release_version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows.iss /DAppVersion=$env:RELEASE_VERSION
          Copy-Item "installer_output\IllustriMIDIStudio-Setup.exe" -Destination "${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare-matrix, build]
    if: needs.prepare-matrix.outputs.has-entries == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-matrix.outputs.release_version }}
          name: ${{ needs.prepare-matrix.outputs.release_version }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe

      # Clean up artifacts at end so github doesn't yell at me about
      # needing to pay money for more artifact storage
      - name: Clean Up Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: "*"
